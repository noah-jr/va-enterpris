name: Filogo CISP-ADMIN CI/CD

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_PATH: /var/www/filogo/cisp-admin
      NODE_VERSION: 22

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install Dependencies
      run: npm install

    - name: Build Next app
      run: npm run build
  
    - name: Install SSH tools
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-client sshpass rsync

    # ✅ PREPARE ALMALINUX VPS
    - name: Prepare Remote Environment
      env:
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      run: |
        sshpass -p $SSH_PASSWORD ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF

          export APP_PATH=${{ env.APP_PATH }}

          echo "Checking Node installation..."

          if ! command -v node >/dev/null 2>&1; then
            echo "Installing NodeJS for AlmaLinux..."

            curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash -
            sudo dnf install -y nodejs
          fi

          node -v
          npm -v

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            sudo npm install -g pm2
          fi

          sudo mkdir -p \$APP_PATH
          sudo chown $VPS_USER:$VPS_USER \$APP_PATH

        EOF

    # ✅ DEPLOY
    - name: Deploy to VPS
      env:
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
        SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      run: |
        echo "Syncing project files..."

        sshpass -p "$SSH_PASSWORD" rsync -avz \
          --exclude=".git" \
          --exclude="node_modules" \
          --exclude=".env" \
          --delete \
          . $VPS_USER@$VPS_HOST:${{ env.APP_PATH }}

        sshpass -p $SSH_PASSWORD ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF

          export APP_PATH=${{ env.APP_PATH }}
          cd \$APP_PATH

          if [ -f ".env.production" ]; then
            cp .env.production .env
            echo ".env atualizado!"
          else
            echo "Aviso: .env.production não encontrado!"
          fi

          npm install

          # ✅ ZERO DOWNTIME
          pm2 reload FILOFO:CISP || pm2 start ecosystem.config.js

          pm2 save

        EOF