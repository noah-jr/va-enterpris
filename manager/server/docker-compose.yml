version: '3.8'
services:
  db:
    image: postgres:15
    container_name: va_onegest_db
    environment:
      POSTGRES_USER: onegest
      POSTGRES_PASSWORD: password
      POSTGRES_DB: onegest_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
