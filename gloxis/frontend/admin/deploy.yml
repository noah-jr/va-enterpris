name: Deploy Admin Portal

on:
  push:
    branches:
      - deploy
      - main
    paths:
      - 'frontend/admin/**'
  pull_request:
    branches:
      - deploy
    paths:
      - 'frontend/admin/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_PATH: /var/www/gloxis/admin
      NODE_VERSION: 22

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/admin/package-lock.json

    - name: Create .env for Build
      run: |
        cat <<EOF > frontend/admin/.env
        VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
        VITE_ADMIN_PORTAL_URL="${{ secrets.VITE_ADMIN_PORTAL_URL }}"
        VITE_CLIENT_PORTAL_URL="${{ secrets.VITE_CLIENT_PORTAL_URL }}"
        EOF

    - name: Install Dependencies
      run: |
        cd frontend/admin
        npm install --legacy-peer-deps

    - name: Build React Admin App
      run: |
        cd frontend/admin
        npm run build

    - name: Install SSH tools
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-client sshpass rsync

    - name: Sync Static Dist Bundle & PM2 Config to VPS
      env:
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: |
        echo "🔄 Syncing admin files to VPS..."
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "mkdir -p $APP_PATH"
        
        sshpass -p "$VPS_PASSWORD" rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          frontend/admin/dist/ "$VPS_USER@$VPS_HOST:$APP_PATH/dist"

        sshpass -p "$VPS_PASSWORD" rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no" \
          frontend/admin/ecosystem.config.cjs "$VPS_USER@$VPS_HOST:$APP_PATH/ecosystem.config.cjs"

    - name: Restart Admin Service on VPS
      env:
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: |
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
          cd $APP_PATH

          if ! command -v node >/dev/null 2>&1; then
            echo "Installing NodeJS 22..."
            curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash -
            sudo dnf install -y nodejs
          fi
          
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2 & serve..."
            sudo npm install -g pm2 serve
          fi

          echo "♻️ Restarting Admin with PM2..."
          pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs || pm2 serve dist 5173 --name "GLOXIS_ADMIN" --spa
          pm2 save

          echo "✅ Deploy do Admin concluído com sucesso!"
        EOF
