version: '3.8'

services:
  # Database (MySQL for production)
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gloxis
    ports:
      - "3309:3306"
    volumes:
      - gloxis_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis for Queues (BullMQ) & Rate Limiting & Caching
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - gloxis_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # MinIO for S3 Compatible Storage (Document Uploads)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretminiopassword
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - gloxis_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

