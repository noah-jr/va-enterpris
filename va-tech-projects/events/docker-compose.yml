version: '3.8'

services:
  # Base de Dados MySQL
  mysql:
    image: mysql:8.0
    container_name: va_events_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: events_db
      MYSQL_USER: events_user
      MYSQL_PASSWORD: events_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - va_events_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Cache Redis
  redis:
    image: redis:alpine
    container_name: va_events_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - va_events_network

  # Adminer (Interface para BD)
  adminer:
    image: adminer
    container_name: va_events_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - va_events_network

networks:
  va_events_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
